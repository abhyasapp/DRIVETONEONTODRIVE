name: Move missing source (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Drive client
        run: python -m pip install --quiet google-api-python-client google-auth

      - name: Move file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          FILE_ID = "1DpNL51689FyxVmvkA_CV1f81oyUXcyQK"
          DRAWING = "1XM35tZnMa-j8tAIzmux5MEDXJqTCKPU-"
          BOOK_NAME = "Level 7 Engineering"

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          d = build("drive", "v3", credentials=creds, cache_discovery=False)

          def kids(fid):
              out, tok = [], None
              while True:
                  r = d.files().list(
                      q=f"'{fid}' in parents and trashed = false",
                      fields="nextPageToken, files(id,name,mimeType)",
                      pageSize=200, pageToken=tok, supportsAllDrives=True,
                      includeItemsFromAllDrives=True,
                  ).execute()
                  out += r.get("files", [])
                  tok = r.get("nextPageToken")
                  if not tok:
                      return out

          f = d.files().get(
              fileId=FILE_ID, fields="id,name,parents,trashed",
              supportsAllDrives=True,
          ).execute()
          print("FILE", f["name"], f["id"], "parents", f.get("parents"))
          if f.get("trashed"):
              sys.exit("file is trashed")

          found = [c for c in kids(DRAWING)
                   if c["name"] == BOOK_NAME
                   and c["mimeType"] == "application/vnd.google-apps.folder"]
          if found:
              book_id = found[0]["id"]
              print("REUSE_BOOK", BOOK_NAME, book_id)
          else:
              book_id = d.files().create(
                  body={"name": BOOK_NAME,
                        "mimeType": "application/vnd.google-apps.folder",
                        "parents": [DRAWING]},
                  fields="id", supportsAllDrives=True,
              ).execute()["id"]
              print("CREATED_BOOK", BOOK_NAME, book_id)

          old = f.get("parents", [])
          if book_id in old:
              print("ALREADY_IN_PLACE", FILE_ID)
              sys.exit(0)
          moved = d.files().update(
              fileId=FILE_ID, addParents=book_id,
              removeParents=",".join(old),
              fields="id,name,parents", supportsAllDrives=True,
          ).execute()
          print("MOVED", moved["name"], moved["id"], moved.get("parents"))
          PY
