name: Daily Pipeline

on:
  schedule:
    # 06:00 UTC daily (11:45 Nepal time) - adjust to taste
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only these steps (comma-separated, e.g. export,upload). Empty = all.'
        required: false
        default: ''
      skip_gemini:
        description: 'Skip the Gemini classify step'
        type: boolean
        default: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Throwaway database for tests/test_postgres_e2e.py (real Postgres, never Neon)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abhyastest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      PYTHONUNBUFFERED: "1"
      # Gemini is the elastic step: cap it, and let the run budget shorten it
      # further so export/upload/chapters always finish inside the job limit.
      GEMINI_STEP_TIMEOUT: "3600"
      PIPELINE_BUDGET_SECONDS: "9900"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Smoke test (offline checks)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/abhyastest
        run: |
          set -euo pipefail
          python tests/smoke.py
          python -m unittest tests.test_corrections tests.test_apply_corrections_qid tests.test_dedupe_logic tests.test_pipeline \
            tests.test_keyword_match tests.test_export_ids tests.test_hardening tests.test_reports_sync \
            tests.test_postgres_e2e

      # The console ships its own identity/keyword JS and its own SQL. Both are
      # checked against the Python and against Postgres here; until now no CI
      # step ran them, so a drift would only be found by hand.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Console parity and SQL tests (offline)
        run: |
          set -euo pipefail
          node tests/test_console_identity.mjs
          npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.16
          node tests/test_admin_sql.mjs
          node tests/test_reported_sql.mjs
          node tests/test_apps_script.mjs

      # ----- credentials -------------------------------------------------

      - name: Validate secrets and write credential files
        uses: ./.github/actions/write-credentials
        with:
          need: db,backend,drive_read,drive_write,gemini
          database_url:           ${{ secrets.DATABASE_URL }}
          apps_script_url:        ${{ secrets.ABHYAS_APPS_SCRIPT_URL }}
          sync_key:               ${{ secrets.ABHYAS_SYNC_KEY }}
          service_account_json:   ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          gdrive_oauth_token:     ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          oauth_token_pickle:     ${{ secrets.OAUTH_TOKEN_PICKLE }}
          oauth_credentials_json: ${{ secrets.OAUTH_CREDENTIALS_JSON }}
          gemini_api_key:         ${{ secrets.GEMINI_API_KEY }}
          gemini_api_key_2:       ${{ secrets.GEMINI_API_KEY_2 }}
          cerebras_api_key:       ${{ secrets.CEREBRAS_API_KEY }}
          openrouter_api_key:     ${{ secrets.OPENROUTER_API_KEY }}

      # ----- pipeline ----------------------------------------------------

      - name: Run pipeline
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          ONLY:               ${{ github.event.inputs.only }}
          SKIP_GEMINI:        ${{ github.event.inputs.skip_gemini }}
        run: |
          args=""
          [ -n "$ONLY" ] && args="$args --only $ONLY"
          [ "$SKIP_GEMINI" = "true" ] && args="$args --skip-gemini"
          # No --quiet: full logs make failures diagnosable.
          python -m pipeline.run_pipeline $args

      # ----- diagnostics -------------------------------------------------

      - name: Open an issue when the run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily pipeline failed ($(date -u +%F))"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                      --search "Daily pipeline failed in:title" --json number --jq '.[0].number' || true)
          body="The scheduled run failed: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Scrub credentials
        if: always()
        run: |
          rm -f service-account.json oauth-credentials.json oauth-token.pickle .env
