name: Daily Drivetoneon Pipeline

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC = 14:45 NPT roughly; adjust as needed
  workflow_dispatch:          # lets you trigger manually from Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write service account file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
        run: |
          python sync_any_level.py all
          python dedupe_exact.py --apply --quiet
          python classify_any_level.py level5
          python classify_any_level.py level7
          python classify_any_level.py gk
          python classify_with_gemini.py all
          python export_any_level.py all
          python upload_any_level.py all
          python generate_chapters_data_all.py
          python upload_chapters_data.py
