name: Daily Pipeline

on:
  schedule:
    # 06:00 UTC daily (11:45 Nepal time) - adjust to taste
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only these steps (comma-separated, e.g. export,upload). Empty = all.'
        required: false
        default: ''
      from_step:
        description: 'Resume from this step onward (e.g. export after a failed run). Empty = start at the beginning.'
        required: false
        default: ''
      skip_gemini:
        description: 'Skip the Gemini classify step'
        type: boolean
        default: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Throwaway database for tests/test_postgres_e2e.py (real Postgres, never Neon)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abhyastest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      PYTHONUNBUFFERED: "1"
      # Gemini is the elastic step: cap it, and let the run budget shorten it
      # further so export/upload/chapters always finish inside the job limit.
      GEMINI_STEP_TIMEOUT: "3600"
      PIPELINE_BUDGET_SECONDS: "9900"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Smoke test (offline checks)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/abhyastest
        run: |
          set -euo pipefail
          python -m pip install --quiet pyflakes
          python -m pyflakes $(git ls-files '*.py' | grep -v '^bootstrap/')
          python tests/smoke.py
          python -m unittest tests.test_corrections tests.test_apply_corrections_qid tests.test_dedupe_logic tests.test_pipeline \
            tests.test_keyword_match tests.test_export_ids tests.test_hardening tests.test_reports_sync \
            tests.test_postgres_e2e tests.test_assign_stable_qn_ids

      # The console ships its own identity/keyword JS and its own SQL. Both are
      # checked against the Python and against Postgres here; until now no CI
      # step ran them, so a drift would only be found by hand.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Console parity and SQL tests (offline)
        run: |
          set -euo pipefail
          node tests/test_console_identity.mjs
          npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.16
          node tests/test_admin_sql.mjs
          node tests/test_reported_sql.mjs
          node tests/test_apps_script.mjs

      # ----- credentials -------------------------------------------------

      - name: Validate secrets and write credential files
        uses: ./.github/actions/write-credentials
        with:
          need: db,backend,drive_read,drive_write,gemini
          database_url:           ${{ secrets.DATABASE_URL }}
          apps_script_url:        ${{ secrets.ABHYAS_APPS_SCRIPT_URL }}
          sync_key:               ${{ secrets.ABHYAS_SYNC_KEY }}
          service_account_json:   ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          gdrive_oauth_token:     ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          oauth_token_pickle:     ${{ secrets.OAUTH_TOKEN_PICKLE }}
          oauth_credentials_json: ${{ secrets.OAUTH_CREDENTIALS_JSON }}
          gemini_api_key:         ${{ secrets.GEMINI_API_KEY }}
          gemini_api_key_2:       ${{ secrets.GEMINI_API_KEY_2 }}
          cerebras_api_key:       ${{ secrets.CEREBRAS_API_KEY }}
          openrouter_api_key:     ${{ secrets.OPENROUTER_API_KEY }}

      # ----- pipeline ----------------------------------------------------

      - name: Run pipeline
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          ONLY:               ${{ github.event.inputs.only }}
          FROM_STEP:          ${{ github.event.inputs.from_step }}
          SKIP_GEMINI:        ${{ github.event.inputs.skip_gemini }}
        run: |
          # Step names only: letters, digits, underscore, comma. Anything else
          # would be passed to the command line as extra arguments.
          for v in "$ONLY" "$FROM_STEP"; do
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[a-z0-9_,]+$'; then
              echo "::error::invalid step list: $v"; exit 2
            fi
          done
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ -n "$FROM_STEP" ] && args+=(--from-step "$FROM_STEP")
          [ "$SKIP_GEMINI" = "true" ] && args+=(--skip-gemini)
          # No --quiet: full logs make failures diagnosable.
          python -m pipeline.run_pipeline "${args[@]}"

      # ----- publish ------------------------------------------------------
      # The app reads abhyasapp/content@main through jsDelivr, never Drive, so
      # the upload above is invisible to learners until that repo's mirror runs.
      # Ask it to run now instead of waiting for its schedule. Needs a
      # fine-grained PAT with Actions: write on abhyasapp/content, stored as the
      # CONTENT_SYNC_TOKEN secret; without it the mirror still publishes on its
      # own cron, just later.
      - name: Publish content to the app
        env:
          GH_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CONTENT_SYNC_TOKEN not set - the content mirror will publish on its schedule"
            exit 0
          fi
          if gh workflow run sync.yml --repo abhyasapp/content --ref main; then
            echo "dispatched abhyasapp/content sync"
          else
            echo "::warning::could not dispatch the content mirror; it will publish on its schedule"
          fi

      # ----- diagnostics -------------------------------------------------

      - name: Open an issue when the run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily pipeline failed ($(date -u +%F))"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                      --search "Daily pipeline failed in:title" --json number --jq '.[0].number' || true)
          body="The scheduled run failed: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      # Non-fatal steps (reports, keyword/Gemini classify) do not turn the run
      # red; this makes sure a step that keeps failing is still noticed.
      - name: Open an issue for non-fatal step problems
        if: always() && github.event_name == 'schedule' && hashFiles('logs/warnings.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Pipeline warnings: a non-fatal step needs attention"
          body="$(printf 'Run: %s\n\n' "$RUN_URL"; cat logs/warnings.txt)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                      --search "Pipeline warnings in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Scrub credentials
        if: always()
        run: |
          rm -f service-account.json oauth-credentials.json oauth-token.pickle .env
